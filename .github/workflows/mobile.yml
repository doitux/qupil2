# Builds Qupil for Android (installable test APK) and iOS (unsigned IPA for sideloading).
# Store builds need signing keys as repository secrets; they are added later.
name: Mobile

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'LICENSES/**', '.github/dependabot.yml']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSES/**', '.github/dependabot.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: '6.8.3'
  # Versions Qt 6.8 is tested with
  ANDROID_NDK_VERSION: '26.1.10909125'
  ANDROID_PLATFORM: 'android-34'
  ANDROID_BUILD_TOOLS: '34.0.0'

jobs:
  android:
    name: Android (arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and platform
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;${ANDROID_NDK_VERSION}" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Qt for Linux (host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true
          set-env: false

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os            # Qt >= 6.7 ships Android for all hosts
          target: android
          arch: android_arm64_v8a
          modules: qtmultimedia
          cache: true

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          bash .github/scripts/run-logged.sh "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$RUNNER_WORKSPACE/Qt/$QT_VERSION/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"

      - name: Build APK
        run: bash .github/scripts/run-logged.sh cmake --build build --target apk --parallel

      # Always the same (public) test key: a newer nightly installs over an older one
      - name: Sign with the test key
        run: |
          apk=$(find build -name '*.apk' -path '*release*' | head -n 1)
          if [ -z "$apk" ]; then apk=$(find build -name '*.apk' | head -n 1); fi
          echo "Built: $apk"
          bt="$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"
          ks=.github/android/qupil-test.keystore
          mkdir -p package
          "$bt/zipalign" -p -f 4 "$apk" aligned.apk
          "$bt/apksigner" sign --ks "$ks" --ks-key-alias qupil-test --ks-pass pass:qupil-test --key-pass pass:qupil-test \
            --out package/qupil-android-arm64-test.apk aligned.apk
          "$bt/apksigner" verify --print-certs package/qupil-android-arm64-test.apk
          ls -l package

      - uses: actions/upload-artifact@v7
        with:
          name: qupil-android-arm64-test
          path: package/*.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS (unsigned)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt for macOS (host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true
          set-env: false

      - name: Install Qt for iOS
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: ios
          arch: ios
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: |
          bash .github/scripts/run-logged.sh "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build -G Xcode \
            -DQT_HOST_PATH="$RUNNER_WORKSPACE/Qt/$QT_VERSION/macos"

      - name: Build for device without signing
        run: |
          bash .github/scripts/run-logged.sh cmake --build build --config Release -- \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      # Unsigned IPA for sideloading (AltStore, Sideloadly, …): the tool signs it with your Apple ID
      - name: Package unsigned IPA
        run: |
          app=$(find build -type d -name '*.app' -path '*Release-iphoneos*' | head -n 1)
          if [ -z "$app" ]; then echo "::error::no .app found in build/"; exit 1; fi
          echo "App bundle: $app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :MinimumOSVersion' -c 'Print :UIDeviceFamily' "$app/Info.plist" || true
          # Files app access must be there, otherwise backups are not reachable on iPad
          if [ "$(/usr/libexec/PlistBuddy -c 'Print :UIFileSharingEnabled' "$app/Info.plist")" != "true" ]; then
            echo "::error::UIFileSharingEnabled missing in Info.plist"; exit 1
          fi
          ls "$app" | grep lproj || true
          mkdir -p ipa/Payload package
          cp -R "$app" ipa/Payload/
          (cd ipa && zip -qry "../package/Qupil-${GITHUB_SHA::7}-unsigned.ipa" Payload)
          ls -l package

      - uses: actions/upload-artifact@v7
        with:
          name: qupil-ios-unsigned-ipa
          path: package/*.ipa
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to "nightly" release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Update the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/publish-nightly.sh \
            'artifacts/qupil-ios-unsigned-ipa/*.ipa=Qupil-iOS-unsigned.ipa' \
            'artifacts/qupil-android-arm64-test/*.apk=Qupil-Android-arm64-test.apk'
