# Builds, tests and packages Qupil for Linux, Windows and macOS.
name: Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'LICENSES/**', '.github/dependabot.yml']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSES/**', '.github/dependabot.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: '6.8.3'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            qt_arch: linux_gcc_64
            artifact: qupil-linux-x86_64
          - name: Windows
            os: windows-2022
            qt_arch: win64_msvc2022_64
            artifact: qupil-windows-x64
          - name: macOS
            os: macos-14
            qt_arch: clang_64
            artifact: qupil-macos-universal

    steps:
      - uses: actions/checkout@v7

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libegl1 libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libfontconfig1 libdbus-1-3

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          modules: qtmultimedia
          cache: true

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: |
          extra=()
          if [ "$RUNNER_OS" = "macOS" ]; then extra+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"); fi
          bash .github/scripts/run-logged.sh cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "${extra[@]}"

      - name: Build
        shell: bash
        run: bash .github/scripts/run-logged.sh cmake --build build --parallel

      - name: Test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash .github/scripts/run-logged.sh ctest --test-dir build --output-on-failure

      - name: Show failed unit tests
        if: failure()
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for t in tst_core tst_languagemanager tst_notes; do
            exe="build/$t"; [ -f "$exe.exe" ] && exe="$exe.exe"
            [ -f "$exe" ] || continue
            set +e
            "$exe" -o "build/$t.txt,txt" > /dev/null 2>&1
            code=$?
            set -e
            out=$( (grep -vE "^PASS" "build/$t.txt" 2>/dev/null || true) | tail -n 40 )
            [ -n "$out" ] || out="no output (exit code $code): missing library or crash?"
            echo "$out"
            msg=$(echo "$out" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN { ORS = "%0A" } { print }')
            if [ "$code" -eq 0 ]; then
              echo "::warning title=$t passed when run again (flaky?)::${msg}"
            else
              echo "::error title=$t (exit $code)::${msg}"
            fi
          done

      # Every screen with sample data, light/dark, desktop/phone size – published with the nightly build
      - name: Screenshots (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for lang in de en; do
            bash .github/scripts/run-logged.sh ./build/qupil --screenshots "screens/$lang" --lang "$lang"
          done
          (cd screens && zip -qr ../qupil-screenshots.zip .)

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: qupil-screenshots
          path: qupil-screenshots.zip
          if-no-files-found: error
          retention-days: 30

      - name: Install with Qt runtime
        shell: bash
        # Qt's deploy step needs an absolute prefix
        run: bash .github/scripts/run-logged.sh cmake --install build --prefix "${GITHUB_WORKSPACE}/dist"

      - name: Pack
        shell: bash
        run: |
          mkdir -p package
          case "$RUNNER_OS" in
            Linux)
              # Start script (also through a link) and menu/desktop launcher next to bin/
              cp platform/linux/qupil.sh platform/linux/install-launcher.sh dist/
              chmod +x dist/qupil.sh dist/install-launcher.sh
              # File and folder say what it is: nightly and commit (a release: its tag). The launcher
              # of install-launcher.sh starts the newest of these folders next to each other.
              build="nightly-${GITHUB_SHA::7}"
              if [ "$GITHUB_REF_TYPE" = tag ]; then build="${GITHUB_REF_NAME}"; fi
              tar --transform="s,^\\.,Qupil-$build," -C dist -czf "package/Qupil-Linux-x86_64-$build.tar.gz" . ;;
            macOS)   ditto -c -k --keepParent dist/Qupil.app "package/${{ matrix.artifact }}.zip" ;;
            Windows) 7z a "package/${{ matrix.artifact }}.zip" ./dist/* > /dev/null ;;
          esac
          ls -l package

      # Installer: a newer one updates the installed Qupil in place (platform/windows/qupil.iss)
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = (Resolve-Path dist).Path
          $package = (Resolve-Path package).Path
          $version = (Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION (\d+\.\d+\.\d+)' | Select-Object -First 1).Matches[0].Groups[1].Value
          $build = "nightly-$($env:GITHUB_SHA.Substring(0, 7))"
          $appVersion = "$version ($build)"
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $build = $env:GITHUB_REF_NAME; $appVersion = $version }
          $exe = (Get-ChildItem $dist -Recurse -Filter Qupil.exe | Select-Object -First 1).FullName.Substring($dist.Length + 1)
          Write-Host "Qupil.exe: $exe"
          Get-ChildItem $dist | Format-Table Mode, Name
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          & $iscc /Q "/DSourceDir=$dist" "/DAppExe=$exe" "/DAppVersion=$appVersion" `
            "/DFileVersion=$version.$($env:GITHUB_RUN_NUMBER)" "/DOutputDir=$package" `
            "/DOutputName=Qupil-Windows-x64-Setup-$build" platform\windows\qupil.iss
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Inno Setup failed ($LASTEXITCODE)"; exit 1 }
          Get-ChildItem $package | Format-Table Name, Length

      # Install, update over it (a file of the old build must go), uninstall – all for the current user
      - name: Check installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem package -Filter 'Qupil-Windows-x64-Setup-*.exe' | Select-Object -First 1).FullName
          $dist = (Resolve-Path dist).Path
          $exe = (Get-ChildItem $dist -Recurse -Filter Qupil.exe | Select-Object -First 1).FullName.Substring($dist.Length + 1)
          $app = "$env:LOCALAPPDATA\Programs\Qupil"
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{70C98A36-44FC-4D45-9D00-3B795E3A8E87}_is1'
          function Fail($message) {
            Write-Host "::error::Installer: $message"
            Get-ChildItem $env:RUNNER_TEMP -Filter 'qupil-setup-*.log' | ForEach-Object { Get-Content $_.FullName -Tail 40 }
            exit 1
          }
          function Run-Setup($log) {
            $p = Start-Process $setup -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/LOG=$env:RUNNER_TEMP\$log"
            if ($p.ExitCode -ne 0) { Fail "setup exit code $($p.ExitCode) ($log)" }
          }
          Run-Setup 'qupil-setup-1.log'
          if (-not (Test-Path "$app\$exe")) { Fail "no $exe after installing" }
          $folder = Get-ChildItem $dist -Directory | Select-Object -First 1
          if ($folder) { Set-Content "$app\$($folder.Name)\left-from-old-build.txt" 'old' }
          Run-Setup 'qupil-setup-2.log'
          if (-not (Test-Path "$app\$exe")) { Fail "no $exe after updating" }
          if ($folder -and (Test-Path "$app\$($folder.Name)\left-from-old-build.txt")) { Fail 'a file of the old build is still there' }
          $entries = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { $_.PSChildName -like '*70C98A36-44FC-4D45-9D00-3B795E3A8E87*' })
          if ($entries.Count -ne 1) { Fail "$($entries.Count) entries under installed apps instead of 1" }
          Write-Host "Installed: $((Get-ItemProperty $key).DisplayName) $((Get-ItemProperty $key).DisplayVersion) in $app"
          Start-Process "$app\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          # The uninstaller hands over to a copy of itself in TEMP: wait until it is done
          for ($i = 0; $i -lt 60 -and ((Test-Path "$app\$exe") -or (Test-Path $key)); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$app\$exe") { Fail 'Qupil.exe still there after uninstalling' }
          if (Test-Path $key) { Fail 'still listed under installed apps after uninstalling' }
          Write-Host 'Install, update and uninstall OK'

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: package/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to "nightly" release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Update the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/publish-nightly.sh \
            'artifacts/qupil-linux-x86_64/*.tar.gz=Qupil-Linux-x86_64*.tar.gz' \
            'artifacts/qupil-windows-x64/*.zip=Qupil-Windows-x64.zip' \
            'artifacts/qupil-windows-x64/Qupil-Windows-x64-Setup-*.exe=Qupil-Windows-x64-Setup-*.exe' \
            'artifacts/qupil-macos-universal/*.zip=Qupil-macOS-universal.zip' \
            'artifacts/qupil-screenshots/*.zip=Qupil-Screenshots.zip'
