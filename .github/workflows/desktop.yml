# Builds, tests and packages Qupil for Linux, Windows and macOS.
name: Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'LICENSES/**', '.github/dependabot.yml']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSES/**', '.github/dependabot.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: '6.8.3'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            qt_arch: linux_gcc_64
            artifact: qupil-linux-x86_64
          - name: Windows
            os: windows-2022
            qt_arch: win64_msvc2022_64
            artifact: qupil-windows-x64
          - name: macOS
            os: macos-15
            qt_arch: clang_64
            artifact: qupil-macos-universal

    steps:
      - uses: actions/checkout@v7

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libegl1 libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libfontconfig1 libdbus-1-3

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          modules: qtmultimedia
          cache: true

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: |
          extra=()
          if [ "$RUNNER_OS" = "macOS" ]; then extra+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"); fi
          bash .github/scripts/run-logged.sh cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "${extra[@]}"

      - name: Build
        shell: bash
        run: bash .github/scripts/run-logged.sh cmake --build build --parallel

      - name: Test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash .github/scripts/run-logged.sh ctest --test-dir build --output-on-failure

      - name: Show failed unit tests
        if: failure()
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for t in tst_core tst_languagemanager tst_notes; do
            exe="build/$t"; [ -f "$exe.exe" ] && exe="$exe.exe"
            [ -f "$exe" ] || continue
            set +e
            "$exe" -o "build/$t.txt,txt" > /dev/null 2>&1
            code=$?
            set -e
            out=$( (grep -vE "^PASS" "build/$t.txt" 2>/dev/null || true) | tail -n 40 )
            [ -n "$out" ] || out="no output (exit code $code): missing library or crash?"
            echo "$out"
            msg=$(echo "$out" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN { ORS = "%0A" } { print }')
            if [ "$code" -eq 0 ]; then
              echo "::warning title=$t passed when run again (flaky?)::${msg}"
            else
              echo "::error title=$t (exit $code)::${msg}"
            fi
          done

      # Every screen with sample data, light/dark, desktop/phone size – published with the nightly build
      - name: Screenshots (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for lang in de en; do
            bash .github/scripts/run-logged.sh ./build/qupil --screenshots "screens/$lang" --lang "$lang"
          done
          (cd screens && zip -qr "../Qupil-Screenshots-nightly-${GITHUB_SHA::7}.zip" .)

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: qupil-screenshots
          path: Qupil-Screenshots-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Install with Qt runtime
        shell: bash
        # Qt's deploy step needs an absolute prefix
        run: bash .github/scripts/run-logged.sh cmake --install build --prefix "${GITHUB_WORKSPACE}/dist"

      - name: Pack
        shell: bash
        run: |
          mkdir -p package
          # Every file says what it is: nightly and commit (a release: its tag)
          build="nightly-${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then build="${GITHUB_REF_NAME}"; fi
          case "$RUNNER_OS" in
            Linux)
              # Start script (also through a link) and menu/desktop launcher next to bin/
              cp platform/linux/qupil.sh platform/linux/install-launcher.sh dist/
              chmod +x dist/qupil.sh dist/install-launcher.sh
              # The launcher of install-launcher.sh starts the newest of these folders next to each other.
              tar --transform="s,^\\.,Qupil-$build," -C dist -czf "package/Qupil-Linux-x86_64-$build.tar.gz" . ;;
            macOS)   ditto -c -k --keepParent dist/Qupil.app "package/Qupil-macOS-universal-$build.zip" ;;
            # Windows: only the installer (below). A ZIP next to it led to parallel copies
            # that were started instead of the installed Qupil.
            Windows) ;;
          esac
          ls -l package

      # Installer: a newer one updates the installed Qupil in place (platform/windows/qupil.iss)
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = (Resolve-Path dist).Path
          $package = (Resolve-Path package).Path
          $version = (Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION (\d+\.\d+\.\d+)' | Select-Object -First 1).Matches[0].Groups[1].Value
          $build = "nightly-$($env:GITHUB_SHA.Substring(0, 7))"
          $appVersion = "$version ($build)"
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $build = $env:GITHUB_REF_NAME; $appVersion = $version }
          $exe = (Get-ChildItem $dist -Recurse -Filter Qupil.exe | Select-Object -First 1).FullName.Substring($dist.Length + 1)
          Write-Host "Qupil.exe: $exe"
          Get-ChildItem $dist | Format-Table Mode, Name
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          & $iscc /Q "/DSourceDir=$dist" "/DAppExe=$exe" "/DAppVersion=$appVersion" `
            "/DFileVersion=$version.$($env:GITHUB_RUN_NUMBER)" "/DProductVersion=$version" "/DOutputDir=$package" `
            "/DOutputName=Qupil-Windows-x64-Setup-$build" platform\windows\qupil.iss
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Inno Setup failed ($LASTEXITCODE)"; exit 1 }
          Get-ChildItem $package | Format-Table Name, Length

      # Install, update over it (a file of the old build must go), uninstall – all for the current user
      - name: Check installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem package -Filter 'Qupil-Windows-x64-Setup-*.exe' | Select-Object -First 1).FullName
          $dist = (Resolve-Path dist).Path
          $exe = (Get-ChildItem $dist -Recurse -Filter Qupil.exe | Select-Object -First 1).FullName.Substring($dist.Length + 1)
          $app = "$env:LOCALAPPDATA\Programs\Qupil"
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{70C98A36-44FC-4D45-9D00-3B795E3A8E87}_is1'
          function Fail($message) {
            Write-Host "::error::Installer: $message"
            Get-ChildItem $env:RUNNER_TEMP -Filter 'qupil-setup-*.log' | ForEach-Object { Get-Content $_.FullName -Tail 40 }
            exit 1
          }
          function Run-Setup($log) {
            $p = Start-Process $setup -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/LOG=$env:RUNNER_TEMP\$log"
            if ($p.ExitCode -ne 0) { Fail "setup exit code $($p.ExitCode) ($log)" }
          }
          Run-Setup 'qupil-setup-1.log'
          if (-not (Test-Path "$app\$exe")) { Fail "no $exe after installing" }
          $folder = Get-ChildItem $dist -Directory | Select-Object -First 1
          if ($folder) { Set-Content "$app\$($folder.Name)\left-from-old-build.txt" 'old' }
          Run-Setup 'qupil-setup-2.log'
          if (-not (Test-Path "$app\$exe")) { Fail "no $exe after updating" }
          if ($folder -and (Test-Path "$app\$($folder.Name)\left-from-old-build.txt")) { Fail 'a file of the old build is still there' }
          $entries = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { $_.PSChildName -like '*70C98A36-44FC-4D45-9D00-3B795E3A8E87*' })
          if ($entries.Count -ne 1) { Fail "$($entries.Count) entries under installed apps instead of 1" }
          Write-Host "Installed: $((Get-ItemProperty $key).DisplayName) $((Get-ItemProperty $key).DisplayVersion) in $app"
          Start-Process "$app\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          # The uninstaller hands over to a copy of itself in TEMP: wait until it is done
          for ($i = 0; $i -lt 60 -and ((Test-Path "$app\$exe") -or (Test-Path $key)); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$app\$exe") { Fail 'Qupil.exe still there after uninstalling' }
          if (Test-Path $key) { Fail 'still listed under installed apps after uninstalling' }
          Write-Host 'Install, update and uninstall OK'

      # Microsoft Store package (MSIX, platform/windows/msix): the Store signs it, so Windows
      # does not warn. Uploaded by hand in Partner Center (docs/microsoft-store.md).
      # Version: major.minor.<run number>.0 – every Store upload needs a higher one.
      - name: Store package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION (\d+)\.(\d+)\.(\d+)' | Select-Object -First 1).Matches[0].Groups
          $msixVersion = "$($version[1].Value).$($version[2].Value).$($env:GITHUB_RUN_NUMBER).0"
          $build = "nightly-$($env:GITHUB_SHA.Substring(0, 7))"
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $build = $env:GITHUB_REF_NAME }
          function Tool($name) {
            $found = @()
            if ($env:WindowsSdkVerBinPath) { $found += @(Get-Item "$($env:WindowsSdkVerBinPath)x64\$name" -ErrorAction SilentlyContinue) }
            $found += @(Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\$name" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending)
            if (-not $found) { Write-Host "::error::$name not found (Windows SDK)"; exit 1 }
            return $found[0].FullName
          }
          $makeappx = Tool 'makeappx.exe'
          $makepri = Tool 'makepri.exe'
          Write-Host "MSIX $msixVersion with $makeappx"

          $stage = Join-Path $env:RUNNER_TEMP 'msix'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory $stage | Out-Null
          Copy-Item dist\* $stage -Recurse
          if (-not (Test-Path "$stage\bin\Qupil.exe")) { Write-Host '::error::bin\Qupil.exe missing (Executable in AppxManifest.xml.in)'; exit 1 }
          # The setup can rely on an installed MSVC runtime, a Store package must bring it along
          if (-not (Test-Path "$stage\bin\vcruntime140.dll")) {
            $crt = Get-ChildItem "$($env:VCToolsRedistDir)x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
            if (-not $crt) { Write-Host '::error::MSVC runtime (VCToolsRedistDir) not found'; exit 1 }
            Copy-Item "$($crt.FullName)\*.dll" "$stage\bin\"
            Write-Host "MSVC runtime from $($crt.FullName)"
          }
          Copy-Item platform\windows\msix\Assets "$stage\Assets" -Recurse
          $manifest = (Get-Content platform\windows\msix\AppxManifest.xml.in -Raw).Replace('@MSIX_VERSION@', $msixVersion)
          Set-Content "$stage\AppxManifest.xml" $manifest -Encoding utf8NoBOM -NoNewline

          # resources.pri for the icons (indexed on their own: all of Qt is not needed in there)
          $pri = Join-Path $env:RUNNER_TEMP 'msix-pri'
          Remove-Item $pri -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory $pri | Out-Null
          Copy-Item "$stage\Assets" "$pri\Assets" -Recurse
          Copy-Item "$stage\AppxManifest.xml" $pri
          $config = Join-Path $env:RUNNER_TEMP 'priconfig.xml'
          & $makepri createconfig /cf $config /dq de-DE_en-US_fr-FR_es-ES /pv 10.0.0 /o | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::makepri createconfig failed'; exit 1 }
          # One resources.pri: split files per scale are only for bundles
          $xml = [xml](Get-Content $config -Raw)
          foreach ($node in @($xml.SelectNodes('//packaging'))) { $node.ParentNode.RemoveChild($node) | Out-Null }
          $xml.Save($config)
          & $makepri new /pr $pri /cf $config /mn "$pri\AppxManifest.xml" /of "$stage\resources.pri" /o
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::makepri new failed'; exit 1 }

          New-Item -ItemType Directory store -Force | Out-Null
          & $makeappx pack /d $stage /p "store\Qupil-Windows-x64-Store-$build.msix" /o
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::makeappx pack failed'; exit 1 }
          Get-ChildItem store | Format-Table Name, Length

      # Installed with a test certificate (same publisher name, trusted only on this runner),
      # started in the package (smoke test), data must land in the real %APPDATA% and stay
      # there after uninstalling
      - name: Check Store package (Windows)
        if: runner.os == 'Windows'
        # Windows PowerShell: the Appx module does not load in PowerShell 7 on the runner
        shell: powershell
        run: |
          function Fail($message) { Write-Host "::error::Store package: $message"; exit 1 }
          $msix = (Get-ChildItem store -Filter '*.msix' | Select-Object -First 1).FullName
          $signtool = @(Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending)[0].FullName
          $publisher = ([xml](Get-Content platform\windows\msix\AppxManifest.xml.in -Raw)).Package.Identity.Publisher
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -FriendlyName 'Qupil CI test' -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $password = ConvertTo-SecureString -String 'qupil-ci-test' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\qupil-test.pfx" -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\qupil-test.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\qupil-test.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $signed = "$env:RUNNER_TEMP\qupil-test.msix"
          Copy-Item $msix $signed -Force
          & $signtool sign /q /fd SHA256 /f "$env:RUNNER_TEMP\qupil-test.pfx" /p qupil-ci-test $signed
          if ($LASTEXITCODE -ne 0) { Fail 'signing the test copy failed' }

          Add-AppxPackage -Path $signed
          $package = Get-AppxPackage -Name FelixHammer.Qupil
          if (-not $package) { Fail 'not installed' }
          Write-Host "Installed $($package.PackageFullName)"

          $data = Join-Path $env:APPDATA 'QupilStoreCheck'
          Remove-Item $data -Recurse -Force -ErrorAction SilentlyContinue
          $alias = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\qupil.exe'
          for ($i = 0; $i -lt 30 -and -not (Test-Path $alias); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $alias)) { Fail 'no app execution alias qupil.exe' }
          $p = Start-Process $alias -ArgumentList '--smoke-test', '--data-dir', $data -Wait -PassThru
          if ($p.ExitCode -ne 0) { Fail "smoke test in the package: exit code $($p.ExitCode)" }
          if (-not (Test-Path "$data\backups")) { Fail "data folder not in the real %APPDATA% (virtualised into the package?)" }

          Remove-AppxPackage -Package $package.PackageFullName
          if (Get-AppxPackage -Name FelixHammer.Qupil) { Fail 'still installed after uninstalling' }
          if (-not (Test-Path "$data\backups")) { Fail 'data folder gone after uninstalling' }
          Write-Host 'Install, start (smoke test), data outside the package, uninstall OK'

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: qupil-windows-store
          path: store/*.msix
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: package/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to "nightly" release
    # Also "Run workflow" on main: the nightly then gets that build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Update the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/publish-nightly.sh \
            'artifacts/qupil-linux-x86_64/*.tar.gz=Qupil-Linux-x86_64*.tar.gz' \
            'artifacts/qupil-windows-x64/Qupil-Windows-x64-Setup-*.exe=Qupil-Windows-x64-Setup-*.exe' \
            'artifacts/qupil-macos-universal/*.zip=Qupil-macOS-universal*.zip' \
            'artifacts/qupil-screenshots/*.zip=Qupil-Screenshots*.zip' \
            '-Qupil-Windows-x64.zip'
