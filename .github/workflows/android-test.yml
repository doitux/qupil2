# Android test run on an emulator: builds Qupil for x86_64 (with the test switch that lets
# the launching intent pass arguments), starts it on a virtual phone and goes through the
# scenarios of .github/scripts/android-test.sh – start with sample data, back from the
# background, Android ending the app, "Don't keep activities", dark mode, drafts.
# Screenshots, Qupil's log and a summary go to the branch "android-test" (only the latest
# run); the whole device log is an artifact. Only sample data, never real data.
name: Android test

on:
  # Every night on main (01:30 UTC)
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      tour:
        description: 'Also run the screenshot tour on the emulator'
        type: boolean
        default: false

permissions:
  contents: write    # write the branch android-test

concurrency:
  group: android-test
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'
  ANDROID_NDK_VERSION: '26.1.10909125'
  ANDROID_PLATFORM: 'android-34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_OPENSSL_COMMIT: 'b71f1470962019bd89534a2919f5925f93bc5779'

jobs:
  emulator:
    if: github.repository == 'doitux/qupil2'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and platform
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;${ANDROID_NDK_VERSION}" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Qt for Linux (host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true
          set-env: false

      - name: Install Qt for Android (x86_64, as the emulator)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_x86_64
          modules: qtmultimedia
          cache: true

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: OpenSSL for Android
        run: |
          dir="$RUNNER_TEMP/android_openssl"
          git init -q "$dir"
          git -C "$dir" remote add origin https://github.com/KDAB/android_openssl
          git -C "$dir" sparse-checkout set --no-cone /ssl_3/x86_64/ /LICENSE
          git -C "$dir" fetch -q --depth 1 --filter=blob:none origin "$ANDROID_OPENSSL_COMMIT"
          git -C "$dir" checkout -q FETCH_HEAD
          echo "ANDROID_OPENSSL_DIR=$dir" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          bash .github/scripts/run-logged.sh "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$RUNNER_WORKSPACE/Qt/$QT_VERSION/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DQUPIL_ANDROID_OPENSSL="$ANDROID_OPENSSL_DIR" \
            -DQUPIL_ANDROID_TEST_ARGS=ON

      - name: Build APK
        run: bash .github/scripts/run-logged.sh cmake --build build --target apk --parallel

      - name: Sign with the test key
        run: |
          apk=$(find build -name '*.apk' -path '*release*' | head -n 1)
          if [ -z "$apk" ]; then apk=$(find build -name '*.apk' | head -n 1); fi
          bt="$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"
          "$bt/zipalign" -p -f 4 "$apk" aligned.apk
          "$bt/apksigner" sign --ks .github/android/qupil-test.keystore --ks-key-alias qupil-test \
            --ks-pass pass:qupil-test --key-pass pass:qupil-test --out qupil-x86_64.apk aligned.apk

      # Hardware acceleration for the emulator (GitHub's Linux runners have KVM)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the scenarios on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QUPIL_TOUR: ${{ inputs.tour && '1' || '0' }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/android-test.sh qupil-x86_64.apk android-test-out

      - name: Device log (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-${{ github.run_number }}
          path: android-test-out/
          if-no-files-found: ignore

      # Only the latest run, without history: the branch stays small
      - name: Results to the branch android-test
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [ -d android-test-out ] || exit 0
          rm -rf results && mkdir results
          cp -r android-test-out/. results/
          rm -f results/logcat-full.txt
          cd results
          git init -q
          git checkout -q -b android-test
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Android test run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" android-test
