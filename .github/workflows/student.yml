# The student app (student/): tests and screenshots on Linux, an installable Android test
# APK, and the iOS archive. Upload to TestFlight (app de.qupil.student) only when started
# by hand with "upload" ticked; the teacher app's workflows are not touched by this one.
name: Student app

on:
  push:
    branches: [main, 'fix/**', 'feature/**']
    paths:
      - 'student/**'
      - 'src/shared/**'
      - 'src/core/Crypto.*'
      - '3rdparty/monocypher/**'
      - '.github/workflows/student.yml'
      - '.github/scripts/student-android-test.sh'
      - '.github/scripts/student-ios-test.sh'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the iOS build to TestFlight (de.qupil.student)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_VERSION: '6.8.3'
  ANDROID_NDK_VERSION: '26.1.10909125'
  ANDROID_PLATFORM: 'android-34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_OPENSSL_COMMIT: 'b71f1470962019bd89534a2919f5925f93bc5779'

jobs:
  linux:
    name: Tests and screenshots (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libxkbcommon-dev libgl1-mesa-dev

      - name: Build
        run: |
          cmake -S student -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      # The example (invented data) in four languages, light; checked by eye before a release
      - name: Screenshots of the example
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p shots
          for lang in de en fr es; do
            rm -rf "$RUNNER_TEMP/state"
            ./build/qupil-student --data-dir "$RUNNER_TEMP/state" --today 2026-11-20 --lang "$lang" \
              --demo --size 390x1800 --screenshot "shots/example-$lang.png"
            rm -rf "$RUNNER_TEMP/state"
            ./build/qupil-student --data-dir "$RUNNER_TEMP/state" --lang "$lang" \
              --size 390x844 --screenshot "shots/welcome-$lang.png"
          done
          ls -l shots

      - uses: actions/upload-artifact@v7
        with:
          name: student-screenshots
          path: shots/*.png
          retention-days: 14

  android:
    name: Android (arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and platform
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;${ANDROID_NDK_VERSION}" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Qt for Linux (host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
          set-env: false

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_arm64_v8a
          cache: true

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: OpenSSL for Android
        run: |
          dir="$RUNNER_TEMP/android_openssl"
          git init -q "$dir"
          git -C "$dir" remote add origin https://github.com/KDAB/android_openssl
          git -C "$dir" sparse-checkout set --no-cone /ssl_3/arm64-v8a/ /LICENSE
          git -C "$dir" fetch -q --depth 1 --filter=blob:none origin "$ANDROID_OPENSSL_COMMIT"
          git -C "$dir" checkout -q FETCH_HEAD
          echo "ANDROID_OPENSSL_DIR=$dir" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S student -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$RUNNER_WORKSPACE/Qt/$QT_VERSION/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DQUPIL_ANDROID_OPENSSL="$ANDROID_OPENSSL_DIR" \
            -DQUPIL_BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      - name: Build APK
        run: cmake --build build --target apk --parallel

      # The same public test key as the teacher app's nightly (installs over older builds)
      - name: Sign with the test key
        run: |
          out="package/Qupil-Practice-Android-arm64-nightly-${GITHUB_SHA::7}.apk"
          apk=$(find build -name '*.apk' -path '*release*' | head -n 1)
          if [ -z "$apk" ]; then apk=$(find build -name '*.apk' | head -n 1); fi
          echo "Built: $apk"
          bt="$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"
          mkdir -p package
          "$bt/zipalign" -p -f 4 "$apk" aligned.apk
          "$bt/apksigner" sign --ks .github/android/qupil-test.keystore --ks-key-alias qupil-test \
            --ks-pass pass:qupil-test --key-pass pass:qupil-test --out "$out" aligned.apk
          "$bt/apksigner" verify "$out"
          "$bt/aapt2" dump badging "$out" | grep -E "^package|application-label|uses-permission" || true
          ls -l package
          # The name under the icon in the phone's language (Qt's own gradle template keeps English only)
          "$bt/aapt2" dump badging "$out" | grep -q "application-label-de:'Qupil Üben'" \
            || { echo "::error::the German name under the icon is missing in the APK"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: student-android-arm64-test
          path: package/*.apk
          if-no-files-found: error
          retention-days: 30

  android-emulator:
    name: Android emulator (links, scanner)
    # A coupling link opens the app and adds the teacher (also while the app is running),
    # and the QR code scanner opens: on an emulator, built for its x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write    # the screenshots go to the branch student-test-android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and platform
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;${ANDROID_NDK_VERSION}" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Qt for Linux (host tools)
        timeout-minutes: 15
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
          set-env: false

      - name: Install Qt for Android (x86_64, as the emulator)
        timeout-minutes: 15
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_x86_64
          cache: true

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S student -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$RUNNER_WORKSPACE/Qt/$QT_VERSION/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"

      - name: Build APK
        run: cmake --build build --target apk --parallel

      - name: Sign with the test key
        run: |
          apk=$(find build -name '*.apk' -path '*release*' | head -n 1)
          if [ -z "$apk" ]; then apk=$(find build -name '*.apk' | head -n 1); fi
          bt="$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"
          "$bt/zipalign" -p -f 4 "$apk" aligned.apk
          "$bt/apksigner" sign --ks .github/android/qupil-test.keystore --ks-key-alias qupil-test \
            --ks-pass pass:qupil-test --key-pass pass:qupil-test --out student-x86_64.apk aligned.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Links and scanner on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: aosp_atd
          channel: canary
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu guest -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/student-android-test.sh student-x86_64.apk student-android-out

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: student-android-emulator
          path: student-android-out
          retention-days: 14

      # Screenshots and summary where they can be looked at without a download
      - name: Results to the branch student-test-android
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [ -d student-android-out ] || exit 0
          cd student-android-out
          rm -f logcat-full.txt
          git init -q
          git checkout -q -b student-test-android
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Student app on the Android emulator, run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" student-test-android

  publish:
    name: Publish to "nightly" release
    # The Android test build next to the teacher app's, so it can be installed on a phone
    # without logging in to GitHub (iPhone: TestFlight)
    if: github.ref == 'refs/heads/main'
    needs: [android, android-emulator]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v7
        with:
          name: student-android-arm64-test
          path: artifacts/student-android-arm64-test

      - name: Update the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The same file once more under a name that stays: the page qupil.de/u links to it
          # in the test phase (student/web/u/index.html, ANDROID_TEST)
          bash .github/scripts/publish-nightly.sh \
            'artifacts/student-android-arm64-test/*.apk=Qupil-Practice-Android-arm64-nightly-*.apk' \
            'artifacts/student-android-arm64-test/*.apk=Qupil-Practice-Android-arm64.apk'

  ios-simulator:
    name: iOS simulator (start, links, scanner sheet)
    # The app starts, qupil-student:… links arrive (at the start and while running), the
    # scanner's sheet opens: in the simulator, without signing
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write    # the screenshots go to the branch student-test-ios
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | grep -viE 'beta|rc' | sort -V | tail -n 1)
          if [ -z "$xcode" ]; then echo "::error::No Xcode 26 on this runner"; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install Qt for macOS (host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true
          set-env: false

      - name: Install Qt for iOS
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: ios
          arch: ios
          cache: true

      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S student -B build -G Xcode \
            -DQT_HOST_PATH="$RUNNER_WORKSPACE/Qt/$QT_VERSION/macos"

      - name: Build for the simulator
        run: |
          cmake --build build --config Release --target qupil-student -- \
            -sdk iphonesimulator ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # idb answers the system's "Open in …?" for a link and taps the scanner's Cancel
      - name: Install idb
        continue-on-error: true
        run: |
          brew tap facebook/fb > /dev/null
          brew trust facebook/fb > /dev/null 2>&1 || true
          brew install idb-companion || true
          python3 -m pip install --break-system-packages --quiet fb-idb || python3 -m pip install --user --quiet fb-idb
          echo "$(python3 -c 'import sysconfig; print(sysconfig.get_path("scripts"))')" >> "$GITHUB_PATH"
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Start, links and scanner sheet in the simulator
        run: bash .github/scripts/student-ios-test.sh student-ios-out

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: student-ios-simulator
          path: student-ios-out
          if-no-files-found: ignore
          retention-days: 14

      - name: Results to the branch student-test-ios
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [ -d student-ios-out ] || exit 0
          cd student-ios-out
          find . -name '*.log' -size +2M -delete
          git init -q
          git checkout -q -b student-test-ios
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Student app in the iOS simulator, run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" student-test-ios

  ios:
    name: iOS archive (→ TestFlight by hand)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | grep -viE 'beta|rc' | sort -V | tail -n 1)
          if [ -z "$xcode" ]; then echo "::error::No Xcode 26 on this runner"; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install Qt for macOS (host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true
          set-env: false

      - name: Install Qt for iOS
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: ios
          arch: ios
          cache: true

      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S student -B build -G Xcode \
            -DQT_HOST_PATH="$RUNNER_WORKSPACE/Qt/$QT_VERSION/macos" \
            -DCMAKE_XCODE_GENERATE_SCHEME=ON \
            -DQUPIL_BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      - name: Archive
        run: |
          xcodebuild archive \
            -project build/qupil-student.xcodeproj -scheme qupil-student -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Student.xcarchive" \
            CODE_SIGNING_ALLOWED=NO -quiet DEBUG_INFORMATION_FORMAT=dwarf-with-dsym

      - name: Check the archive
        run: |
          app=$(find "$RUNNER_TEMP/Student.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -n 1)
          if [ -z "$app" ]; then echo "::error::no app in the archive"; exit 1; fi
          plist="$app/Info.plist"
          for key in CFBundleIdentifier CFBundleVersion CFBundleDisplayName CFBundleURLTypes; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$plist"
          done
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "de.qupil.student" ] \
            || { echo "::error::wrong bundle identifier"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$plist" \
            || { echo "::error::no camera usage description (the QR code scanner would crash)"; exit 1; }
          ls "$app" | grep -E 'lproj|Assets.car|PrivacyInfo' || true

      # The archive is built without signing, and the export signs what it finds: it takes
      # the entitlements from the app's signature. So the app gets an ad-hoc signature with
      # "Associated Domains" (https://qupil.de/u#… opens the app); the export replaces the
      # signature and keeps the entitlement (the App ID has the capability).
      - name: Entitlements for the export (Associated Domains)
        run: |
          app=$(find "$RUNNER_TEMP/Student.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -n 1)
          codesign --force --sign - --entitlements student/platform/ios/QupilStudent.entitlements "$app"
          codesign -d --entitlements - --xml "$app" 2>/dev/null | plutil -convert xml1 -o - - | tee "$RUNNER_TEMP/entitlements.xml"
          grep -q 'applinks:qupil.de' "$RUNNER_TEMP/entitlements.xml" \
            || { echo "::error::the entitlement did not get into the archive"; exit 1; }

      - name: Sign and upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && inputs.upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '8LBKF4942K' }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::App Store Connect secrets are not set"; exit 1
          fi
          keydir="$RUNNER_TEMP/asc"
          mkdir -p "$keydir"
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$ASC_KEY_P8" > "$keydir/AuthKey_$ASC_KEY_ID.p8"
          cat > "$keydir/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store-connect</string>
              <key>destination</key><string>upload</string>
              <key>teamID</key><string>$APPLE_TEAM_ID</string>
              <key>signingStyle</key><string>automatic</string>
              <key>uploadSymbols</key><true/>
              <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Student.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$keydir/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$keydir/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log"
          status=${PIPESTATUS[0]}
          {
            echo "## Upload of student build $GITHUB_RUN_NUMBER: exit $status"
            echo '```'
            grep -E "Upload succeeded|EXPORT (SUCCEEDED|FAILED)|^error|ITMS-" "$RUNNER_TEMP/export.log" | tail -n 20
            echo '```'
            # What the uploaded app was signed with
            summary="$RUNNER_TEMP/export/DistributionSummary.plist"
            if [ -f "$summary" ] && grep -q 'applinks:qupil.de' "$summary"; then
              echo "Associated Domains (applinks:qupil.de) is in the uploaded app."
            else
              echo "**Associated Domains is NOT in the uploaded app** (links open qupil.de/u first)."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status
